services:
  postgres:
    image: postgres:16
    container_name: dreammore-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dreammore_user
      POSTGRES_PASSWORD: dreammore_pass
      POSTGRES_DB: dreammore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: dreammore-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata: